<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg">
<title>Cracked GTM Onboarding Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=Bangers&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: comic-brutalist control room. Sticky top bar, client rail on the left, one client workspace with tabs on the right. Tokens mirror crackedgtm.ai. */
:root{
  --ink:#111111; --paper:#FDFCF7; --band:#F4F2EA; --card:#FFFFFF; --muted:#5A5852;
  --red:#D7191F; --yellow:#FFD60A; --on-yellow:#111111; --on-red:#FFFFFF;
  --good:#1F8A4C; --warn:#B86E00; --line:#111111; --shadow:#111111; --code-bg:#F4F2EA;
  --f-display:'Archivo Black','Arial Black',Impact,sans-serif;
  --f-body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-comic:'Bangers','Impact',cursive;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#F3F0E6; --paper:#151513; --band:#1E1E1B; --card:#1B1B19; --muted:#A8A498;
  --red:#F0373D; --yellow:#FFD60A; --on-yellow:#111111; --on-red:#FFFFFF;
  --good:#4CC57F; --warn:#F2A93B; --line:#F3F0E6; --shadow:#000000; --code-bg:#22221F; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#F3F0E6; --paper:#151513; --band:#1E1E1B; --card:#1B1B19; --muted:#A8A498;
  --red:#F0373D; --yellow:#FFD60A; --on-yellow:#111111; --on-red:#FFFFFF;
  --good:#4CC57F; --warn:#F2A93B; --line:#F3F0E6; --shadow:#000000; --code-bg:#22221F; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.display{font-family:var(--f-display);letter-spacing:-.02em}
.comic{font-family:var(--f-comic);letter-spacing:1.5px;font-weight:400}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:18px;letter-spacing:-.02em}
.brand span{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
#clientPick{padding:7px 10px;border:2px solid var(--line);background:var(--card);font-weight:700;max-width:220px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;font-family:var(--f-display);font-size:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--shadow);transition:transform .1s ease,box-shadow .1s ease;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.red{background:var(--red);color:var(--on-red)}
.btn.yellow{background:var(--yellow);color:var(--on-yellow)}
.btn.sm{min-height:32px;padding:0 12px;font-size:12px}
.btn.ghost{box-shadow:none}
main{max-width:900px;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;gap:18px;min-width:0}
.foot{max-width:900px;margin:0 auto;padding:0 16px 32px}
.step{border:2px solid var(--line);background:var(--card)}
.step.next{border-width:3px;box-shadow:5px 5px 0 var(--red)}
.step-h{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
.step-h h2{font-family:var(--f-display);font-size:18px;letter-spacing:-.02em;margin-right:auto}
.step-h .n{width:28px;height:28px;display:grid;place-items:center;border:2px solid var(--line);font-family:var(--f-display);font-size:14px;flex-shrink:0}
.step.done .step-h .n{background:var(--good);border-color:var(--good);color:#fff}
.step.next .step-h .n{background:var(--yellow);color:var(--on-yellow)}
.step-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.step-b > .input-card{border-style:dashed}
.banner{border:2px solid var(--red);background:var(--card);color:var(--red);padding:10px 14px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
.extras{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.extras > details{width:100%}
.email-one{display:flex;flex-direction:column;gap:12px}
.email-one .field textarea{min-height:340px}
.icp,.codebox{box-shadow:none!important}
/* empty */
.empty{max-width:640px;margin:40px auto;display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.empty h1{font-family:var(--f-display);font-size:clamp(34px,5vw,56px);line-height:.98;letter-spacing:-.035em}
.empty p{font-size:18px;margin:0;max-width:60ch}
.hl{background:var(--yellow);color:var(--on-yellow);padding:0 6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%}
.flow div{padding:14px;border:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px}
.flow b{font-family:var(--f-comic);font-size:16px;letter-spacing:1.5px;color:var(--red)}
.flow span{font-size:14px;font-weight:600}

/* client header */
.chead{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.chead h1{font-family:var(--f-display);font-size:clamp(28px,4vw,40px);line-height:1;letter-spacing:-.035em}
.chead .sub{margin-top:6px;font-size:14px;font-weight:600;color:var(--muted);word-break:break-all}
.stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin:20px 0 6px;border:3px solid var(--line)}
.stage{padding:8px 10px;font-size:12px;font-weight:700;border-right:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:2px;min-width:0}
.stage:last-child{border-right:0}
.stage i{font-style:normal;font-family:var(--f-comic);font-size:14px;letter-spacing:1px;color:var(--muted)}
.stage.done{background:var(--ink);color:var(--paper)}
.stage.done i{color:var(--yellow)}
.stage.now{background:var(--yellow);color:var(--on-yellow)}
.stage.now i{color:var(--red)}

.tabs{display:flex;gap:0;margin-top:22px;border-bottom:3px solid var(--line);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:10px 16px;font-family:var(--f-display);font-size:14px;border:3px solid transparent;border-bottom:0;margin-bottom:-3px;white-space:nowrap}
.tab.on{background:var(--card);border-color:var(--line);border-bottom:3px solid var(--card)}
.tab:focus-visible{outline:3px solid var(--red)}
.pane{padding-top:22px}

/* brain */
.brain{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.colhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.colhead h2{font-family:var(--f-comic);font-size:24px;letter-spacing:2px}
.input-card{border:2px solid var(--line);background:var(--card)}
.input-card summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px}
.input-card summary::-webkit-details-marker{display:none}
.input-card summary .t{font-weight:700;flex:1;min-width:0}
.input-card summary .h{font-size:12px;color:var(--muted);font-weight:500;display:block}
.input-card .body{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.input-card textarea{width:100%;min-height:130px;resize:vertical;padding:10px;border:2px solid var(--line);background:var(--paper);font-size:13px;line-height:1.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--good);color:#fff;border-color:var(--good)}
.chip.miss{background:transparent;color:var(--muted);border-color:var(--muted);border-style:dashed}
.chip.y{background:var(--yellow);color:var(--on-yellow)}
.chip.r{background:var(--red);color:var(--on-red)}
.hint{font-size:12px;color:var(--muted)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

.icp{border:3px solid var(--line);background:var(--card);box-shadow:8px 8px 0 var(--red);display:flex;flex-direction:column}
.icp-top{background:var(--ink);color:var(--paper);padding:16px 18px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.icp-top .k{font-family:var(--f-comic);font-size:16px;letter-spacing:2px;background:var(--yellow);color:var(--on-yellow);padding:1px 8px;display:inline-block}
.icp-top h3{font-family:var(--f-display);font-size:22px;margin-top:6px;line-height:1.1}
.meter{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums}
.meter b{font-family:var(--f-display);font-size:32px;line-height:1}
.meter span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.bar{width:140px;height:10px;border:2px solid var(--paper)}
.bar i{display:block;height:100%;background:var(--yellow)}
.icp-body{padding:18px;display:flex;flex-direction:column;gap:18px}
.icp-body h4{margin:0 0 8px;font-family:var(--f-comic);font-size:19px;letter-spacing:2px;color:var(--red);font-weight:400}
.icp-body p{margin:0}
.arch{display:grid;gap:10px}
.arch div{padding:12px;border:2px solid var(--line);background:var(--paper);display:flex;flex-direction:column;gap:4px;font-size:14px}
.arch b{font-family:var(--f-display);font-size:16px}
.crit{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.crit li{display:flex;gap:10px;align-items:flex-start}
.crit li::before{content:"";flex-shrink:0;width:10px;height:10px;margin-top:6px;border:2px solid var(--line);background:var(--good)}
.crit.dq li::before{background:var(--red)}
.crit.gap li::before{background:var(--yellow)}
.crit .w{font-family:var(--f-mono);font-size:11px;padding:0 5px;border:1px solid var(--line);margin-left:auto;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.status{font-size:13px;font-weight:600;min-height:1.4em}
.status.err{color:var(--red)}
.thinking{display:flex;align-items:center;gap:10px;padding:18px;font-weight:700}
.dot{width:12px;height:12px;background:var(--red);border:2px solid var(--line);animation:pop 1s infinite}
@keyframes pop{50%{transform:scale(1.4) rotate(45deg)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.btn{transition:none}}
.icp-empty{padding:22px 18px;display:flex;flex-direction:column;gap:10px}
.icp-empty p{margin:0;font-size:14px;color:var(--muted)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--red)}
.history{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* code */
.codebox{position:relative;border:3px solid var(--line);background:var(--code-bg);box-shadow:6px 6px 0 var(--shadow)}
.codebox pre{margin:0;padding:18px;overflow:auto;max-height:620px;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.codebar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:3px solid var(--line);background:var(--card);flex-wrap:wrap}
.codebar b{font-family:var(--f-comic);font-size:18px;letter-spacing:2px}
.stack{display:flex;flex-direction:column;gap:22px}
.note{padding:12px 14px;border:2px dashed var(--line);font-size:14px;background:var(--band)}
.note b{font-weight:700}
.seg{display:inline-flex;border:2px solid var(--line)}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13px;font-weight:700}
.seg button.on{background:var(--ink);color:var(--paper)}

/* email */
.email{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea{padding:10px;border:2px solid var(--line);background:var(--card);width:100%}
.field textarea{min-height:420px;resize:vertical;line-height:1.55}

/* checklist */
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--good);flex-shrink:0;margin-top:2px}
.check b{display:block;font-size:15px}
.check span{font-size:13px;color:var(--muted)}
.check.on{background:var(--band)}
.check.on b{text-decoration:line-through;text-decoration-thickness:2px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.modal{width:100%;max-width:540px;background:var(--paper);border:3px solid var(--line);box-shadow:10px 10px 0 var(--red);display:flex;flex-direction:column}
.modal-top{background:var(--red);color:var(--on-red);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal-top h2{font-family:var(--f-display);font-size:24px;letter-spacing:-.02em}
.modal form{padding:20px;display:flex;flex-direction:column;gap:14px}
.modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.x{all:unset;cursor:pointer;font-family:var(--f-display);font-size:22px;padding:0 6px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;font-weight:700;border:2px solid var(--line);box-shadow:4px 4px 0 var(--red);z-index:60}

/* leads + backtest */
.tablewrap{overflow-x:auto;border:3px solid var(--line);background:var(--card)}
table.leads{border-collapse:collapse;width:100%;font-size:13px;min-width:760px}
.leads th{position:sticky;top:0;background:var(--ink);color:var(--paper);text-align:left;padding:8px 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.leads td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.leads td.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);white-space:nowrap}
.leads tr.fail td{color:var(--muted)}
.leads a{color:inherit}
.score{display:inline-block;min-width:44px;text-align:center;padding:1px 6px;border:2px solid var(--line);font-weight:700}
.score.pass{background:var(--good);color:#fff;border-color:var(--good)}
.score.no{background:transparent}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stats div{padding:14px;border:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px}
.stats b{font-family:var(--f-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;font-weight:600}
.stats div.good{background:var(--good);color:#fff;border-color:var(--good)}
.stats div.bad{background:var(--red);color:var(--on-red)}
.bt-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bt-grid textarea{width:100%;min-height:200px;padding:10px;border:2px solid var(--line);background:var(--card);font-size:13px}
.range{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.range input{accent-color:var(--red);width:180px}
.mini{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mini input{padding:7px 9px;border:2px solid var(--line);background:var(--paper);font-size:13px;min-width:0;flex:1}
/* guided test */
.guide{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 110px);overflow:auto;background:var(--paper);border:3px solid var(--line);box-shadow:8px 8px 0 var(--red);z-index:40}
.guide-top{background:var(--yellow);color:var(--on-yellow);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:3px solid var(--line)}
.guide-top b{font-family:var(--f-comic);font-size:20px;letter-spacing:2px;font-weight:400}
.guide ol{list-style:none;margin:0;padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px}
.guide li{border:2px solid var(--line);background:var(--card);padding:10px;display:flex;flex-direction:column;gap:6px}
.guide li.done{opacity:.6}
.guide li.cur{box-shadow:4px 4px 0 var(--shadow);border-width:3px}
.guide li .gt{display:flex;gap:8px;align-items:flex-start;font-weight:700}
.guide li .gt i{font-style:normal;font-family:var(--f-mono);font-size:11px;padding:1px 5px;border:2px solid var(--line);flex-shrink:0}
.guide li.done .gt i{background:var(--good);color:#fff;border-color:var(--good)}
.guide li p{margin:0;font-size:13px;color:var(--muted)}
.guide .gbar{height:8px;border:2px solid var(--line);margin:10px 12px 0}
.guide .gbar i{display:block;height:100%;background:var(--good)}
@media (max-width:760px){.bt-grid{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.spend{font-size:13px}
.spend summary{cursor:pointer;color:var(--muted)}
.spend summary b{color:var(--ink)}
.spend .body{padding-top:8px;display:flex;flex-direction:column;gap:6px}
.spend table.leads{min-width:0}
.clientbar{max-width:900px;margin:0 auto;padding:12px 16px 0;display:flex;gap:8px;flex-wrap:wrap}
.cpill{all:unset;cursor:pointer;display:flex;flex-direction:column;padding:6px 12px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:13px}
.cpill span{font-size:11px;font-weight:500;color:var(--muted)}
.cpill.on{background:var(--ink);color:var(--paper)}
.cpill.on span{color:var(--paper);opacity:.75}
.cpill.add{border-style:dashed;justify-content:center}
.cpill:focus-visible{outline:3px solid var(--red)}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);overflow-x:auto;margin-top:-4px}
.tab{all:unset;cursor:pointer;padding:9px 16px;font-family:var(--f-display);font-size:14px;border:2px solid transparent;border-bottom:0;margin-bottom:-2px;white-space:nowrap}
.tab.on{background:var(--card);border-color:var(--line);border-bottom:2px solid var(--card)}
.tab:focus-visible{outline:3px solid var(--red)}
.tcount{font-family:var(--f-body);font-size:11px;font-weight:700;padding:1px 6px;background:var(--yellow);color:var(--on-yellow);margin-left:4px}
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:10;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--line);background:var(--card)}
.spacer{flex:1}
.lead-row{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:start;border-top:1px solid var(--line)}
.lead-row:first-child{border-top:0}
.lead-row > input{margin:14px 0 0 12px;width:16px;height:16px;accent-color:var(--red)}
.lead-row .lead{border-top:0}
.srcs{display:flex;flex-direction:column;border:2px solid var(--line);background:var(--card)}
.src{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px 12px;border-top:1px solid var(--line)}
.src:first-child{border-top:0}
.src.off{opacity:.55}
.src input{margin-top:3px;width:16px;height:16px;accent-color:var(--red)}
.src-m{display:flex;flex-direction:column;gap:3px;min-width:0}
.src-m .hint{overflow-wrap:anywhere}
.src-a{display:flex;gap:6px;align-items:center}
.addloc{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border:2px dashed var(--line);font-size:13px;font-weight:700}

/* ---------- CSV parsing for customer exports ---------- */
function parseCSV(text){
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function customerDigest(raw){
  raw = String(raw || "").trim();
  if (!raw) return {domains:[], count:0, text:""};
  let rows = [];
  if (raw.includes(",") && raw.split("\n").length > 1) rows = parseCSV(raw);
  const domains = new Map(); let count = 0; let lines = [];
  if (rows.length > 1){
    const head = rows[0].map(h => h.toLowerCase().trim());
    const idx = n => head.findIndex(h => n.some(x => h === x || h.includes(x)));
    const iEmail = idx(["email"]), iName = idx(["name"]), iDesc = idx(["description","company"]), iAmt = idx(["total spend","amount","mrr","plan"]);
    for (const r of rows.slice(1)){
      count++;
      const d = domainOf(r[iEmail] ?? "");
      if (d && !FREEMAIL.has(d)) domains.set(d, (domains.get(d)||0) + 1);
      if (lines.length < 150) lines.push([r[iName], d || r[iEmail], r[iDesc], r[iAmt]].filter(Boolean).join(" | "));
    }
  } else {
    for (const line of raw.split(/\n+/)){
      if (!line.trim()) continue; count++;
      // full hostname: every label, so demo.sequin.events isn't cut to demo.sequin.ev
      const m = line.match(/[\w.+-]+@(?:[a-z0-9-]+\.)+[a-z]{2,24}\b/i) || line.match(/(?:https?:\/\/)?(?:www\.)?(?:[a-z0-9-]+\.)+[a-z]{2,24}(?![a-z0-9-])/i);
      const d = m ? domainOf(m[0]) : "";
      if (d && !FREEMAIL.has(d)) domains.set(d, (domains.get(d)||0) + 1);
      if (lines.length < 150) lines.push(line.trim().slice(0,200));
    }
  }
  return {domains:[...domains.keys()], count, text: lines.join("\n")};
}

  sp.usd = (sp.usd || 0) + (b.cost || 0); sp.credits = (sp.credits || 0) + (b.credits || 0);
  const st = sp.steps[step] = sp.steps[step] || {usd: 0, credits: 0, calls: 0};

  clearTimeout(spendTimer); spendTimer = setTimeout(() => saveClient(c.id, {spend: c.spend}, true), 1500);

async function api(path, opts = {}){

    if (/founder|owner/.test(t)) return "Founder"; if (/\bceo\b|chief executive/.test(t)) return "CEO";

    if (/market|growth|demand/.test(t)) return "Marketing / growth"; if (/\bcto\b|engineer|technolog|developer/.test(t)) return "Engineering";

async function parseTarget(c, scope, text){
  text = String(text || "").trim();

  if (!status.claude){ toast("Add ANTHROPIC_API_KEY to the Worker first"); return; }
  const key = c.id + ":tgt:" + scope;
  busy[key] = true; render();
  try {
    const {data} = await api("/api/claude", {body: {prompt: titlesPrompt(c, text, scope), maxTokens: 4000}});
    const keepE = (xs, allowed) => { const m = new Map(allowed.map(a => [a.toLowerCase(), a])); return arr(xs).map(x => m.get(String(x).toLowerCase())).filter(Boolean); };
    const titles = cleanTitles(data?.titles);
    if (!titles.length) throw {error: "Couldn't turn that into job titles. Try naming the roles, e.g. head of growth, VP sales."};
    busy[key] = false; delete drafts[c.id + ":tgt-" + scope];

    // places mentioned in the request become clickable Prospeo location suggestions
    const places = arr(data.locations).slice(0, 3);

      for (const p of places){ try { const r = await api("/api/prospeo/suggest", {body: {location: p}}); found.push(...arr(r.location_suggestions).slice(0, 4)); } catch {} }
      if (found.length){ c._locSug = {...(c._locSug || {}), [scope]: found}; render(); toast("Titles set. Click a location below to add it."); return; }
    }
    toast(titles.length + " job titles set");
  } catch(e){ busy[key] = false; c._err = e.error || "Couldn't read that request. Try again."; render(); }
}

    if (k === "person_department"){ x = {include: keepE(x.include, DEPARTMENTS)}; if (!x.include.length) { dropped.push(k); continue; } }

      const fix = xs => [...new Set(arr(xs).map(t => String(t).toLowerCase().trim()).flatMap(t => ACR[t] ? [ACR[t]] : t.length >= 4 ? [t] : []))];

}

// Pull page 1 of every variant, score it, and report precision so the best one wins on evidence
async function testVariants(c){
  const t = c.translation; if (!t) return;
  busy[c.id + ":variants"] = true; c._err = ""; render();
  const stats = {}; let leads = arr(c.leads); const pulls = arr(c.pulls).slice();
  for (let k = 0; k < t.variants.length; k++){
    const v = t.variants[k]; const p = cleanVariant(c, v);
    stats[k] = {status: "running"}; c.variantStats = {...stats}; render();
    try {
      const res = await api("/api/prospeo/search", {body: {...p.body, page: 1}});
      const raw = res.results || [];
      const batch = raw.map(normalizeLead).map(l => ({...l, variant: v.name}));
      const pullId = "p" + Date.now().toString(36) + k;
      const scored = batch.length ? (await scoreRows(c, batch.map(leadRow))).results : [];
      const merged = batch.map((l, n) => ({...l, ...(scored[n] || {}), ...(scored[n] ? {icpV: c.icp.version} : {}), pullId}));
      const newOnes = merged.filter(l => !leads.some(x => x.key === l.key));
      if (newOnes.length) pulls.push({id: pullId, at: now(), label: v.name + " test", count: newOnes.length});
      const seen = new Set(leads.map(l => l.key)); leads = [...leads, ...merged.filter(l => !seen.has(l.key))];
      const passing = merged.filter(l => l.pass).length;
      stats[k] = {status: "done", total: res.pagination?.total_count ?? null, pulled: merged.length, passing, rate: merged.length ? Math.round(passing / merged.length * 100) : 0,
        avg: merged.length ? Math.round(merged.reduce((a, l) => a + (l.score || 0), 0) / merged.length * 10) / 10 : 0, attempts: res.attempts, dropped: arr(res.attempts).map(a => a.dropped).filter(Boolean)};
    } catch(e){ stats[k] = {status: "error", error: e.error, attempts: e.attempts}; }
    c.variantStats = {...stats}; render();
  }
  const ranked = Object.entries(stats).filter(([, s]) => s.status === "done" && s.pulled).sort((a, b) => b[1].rate - a[1].rate || b[1].passing - a[1].passing);
  busy[c.id + ":variants"] = false;
  await saveClient(c.id, {variantStats: stats, variantIdx: ranked.length ? Number(ranked[0][0]) : null, variantPages: Object.fromEntries(Object.keys(stats).map(k => [k, 1])), leads: leads.slice(-500), pulls: pulls.slice(-30), _view: "latest", checks: {...(c.checks||{}), listBuilt: true}, checkedAt: {...(c.checkedAt||{}), listBuilt: c.checkedAt?.listBuilt || now()}});
  toast(ranked.length ? `Best: ${t.variants[ranked[0][0]].name} (${ranked[0][1].rate}% pass)` : "No variant returned leads");
}

function normalizeLead(r){
  const p = r.person || r.profile || r;
  const co = r.company || p.company || {};
  const loc = p.location || {};
  const name = p.full_name || p.name || [p.first_name, p.last_name].filter(Boolean).join(" ");
  return {
    name: name || "(no name)",
    title: p.current_job_title || p.job_title || p.title || p.headline || "",
    company: co.name || p.company_name || "",
    domain: domainOf(co.domain || co.website || p.company_domain || ""),
    location: typeof loc === "string" ? loc : [loc.city, loc.state, loc.country].filter(Boolean).join(", "),
    linkedin: p.linkedin_url || p.linkedin || "",
    headcount: co.employee_count || co.headcount || co.employee_range || "",
    industry: co.industry || "",
    description: String(co.description || co.description_ai || co.short_description || "").slice(0, 300),
    headline: p.headline || "",
    tenure: Number((arr(p.job_history).find(h => h.current) || {}).duration_in_months) || null,
    past: arr(p.job_history).filter(h => !h.current).slice(0, 3).map(h => `${h.title || ""} @ ${h.company_name || ""}`).join("; "),
    funding: co.funding?.last_funding_stage || co.funding?.stage || "",
    pid: p.person_id || "",
    first: p.first_name || "", last: p.last_name || "",
    key: p.person_id || p.id || p.linkedin_url || name + "|" + (co.name || ""),
  };
}
async function runSearch(c){

  if (!status.prospeo){ toast("Add PROSPEO_API_KEY to the Worker first"); return; }
  busy[c.id + ":search"] = true; c._err = ""; render();
  try {
    const page = vi != null ? (Number(c.variantPages?.[vi]) || 0) + 1 : (Number(c.prospeoPage) || 0) + 1;
    // The server retries with fewer filters if Prospeo rejects the search and reports every attempt
    let res;
    try { res = await api("/api/prospeo/search", {body: {...p.body, page}}); }
    catch(e){ c._attempts = e.attempts || null; throw e; }
    c._attempts = arr(res.attempts).length > 1 ? res.attempts : null;
    const dropped = arr(res.attempts).map(a => a.dropped).filter(Boolean);
    if (dropped.length){ const why = res.attempts.find(a => !a.ok); c._err = `Pulled without ${dropped.map(x => x.replace(/^(company|person)_/, "").replace(/_/g, " ")).join(", ")}. Prospeo's reason: ${[why?.error_code, why?.filter_error, why?.message].filter(Boolean).join(" · ")}`; }
    const raw = res.results || res.response?.results || res.data || [];
    const seen = new Set(arr(c.leads).map(l => l.key));
    const pullId = "p" + Date.now().toString(36);
    const fresh = raw.map(normalizeLead).map(l => ({...l, pullId, ...(vi != null ? {variant: c.translation.variants[vi].name} : {})})).filter(l => !seen.has(l.key));
    const total = res.pagination?.total_count ?? c.prospeoTotal;
    busy[c.id + ":search"] = false;
    await saveClient(c.id, {...(fresh.length ? {_view: "latest", pulls: [...arr(c.pulls), {id: pullId, at: now(), label: vi != null ? c.translation.variants[vi].name : "ICP filters", count: fresh.length}].slice(-30)} : {}), leads: [...arr(c.leads), ...fresh].slice(-500), ...(vi != null ? {variantPages: {...(c.variantPages || {}), [vi]: page}} : {prospeoPage: page}), prospeoTotal: total, lastRaw: raw[0] ? JSON.stringify(raw[0], null, 2).slice(0, 4000) : "", checks: {...(c.checks||{}), listBuilt: true}, checkedAt: {...(c.checkedAt||{}), listBuilt: c.checkedAt?.listBuilt || now()}});
    toast(fresh.length ? fresh.length + " new leads. Scoring…" : "No new leads on that page");
    if (fresh.length && status.claude) scoreLeads(clients.find(x => x.id === c.id) || c, [pullId]);
  } catch(e){ busy[c.id + ":search"] = false; c._err = e.error + (e.detail ? " · " + JSON.stringify(e.detail).slice(0, 300) : ""); render(); }
}

Rules:

Reply with only a JSON array, one object per row, in row order:

"hits" lists every qualification criterion (Q-number) the lead meets. Give credit when the row or well-known facts about the company clearly support it, including strong implication from title, company name and description; leave it out when unknown.`;

// Claude marks which criteria each lead meets; the tool adds up the points itself so the scale can't drift
function pointsFromHits(c, hits){
  const q = arr(c.icp?.qualification);
  return arr(hits).map(h => Number(String(h).replace(/\D/g, "")) - 1).filter(n => q[n]).reduce((sum, n) => sum + (Number(q[n].weight) || 1), 0);
}
async function scoreRows(c, rows, onProgress){
  const out = new Array(rows.length); const size = 25; const chunks = [];
  for (let k = 0; k < rows.length; k += size) chunks.push(k);
  let done = 0, failed = 0, lastErr = "";
  const work = async start => {
    const chunk = rows.slice(start, start + size);
    try {
      const {data} = await api("/api/claude", {body: {prefix: scorePrompt(c), prompt: "Rows:\n" + chunk.map((r, n) => `#${n} ${r}`).join("\n"), maxTokens: 6000, tier: "fast"}, step: "Scoring"});
      const list = Array.isArray(data) ? data : arr(data?.results || data?.leads);
      chunk.forEach((_, n) => {
        const r = list.find(x => Number(x.i) === n) || list[n] || {};
        const hits = arr(r.hits).map(String);
        const score = hits.length ? pointsFromHits(c, hits) : Math.max(0, Math.min(totalPts(c), Number(r.score) || 0));
        const dq = r.disqualifier && !/^(null|none|no|false)$/i.test(String(r.disqualifier)) ? String(r.disqualifier) : "";
        out[start + n] = {score, pass: score >= passMark(c) && !dq, archetype: r.archetype || "", disqualifier: dq, reason: r.reason || "", hook: r.hook || "", hits};
      });
    } catch(e){ failed += chunk.length; lastErr = e.error || "Scoring failed"; }
    done += chunk.length; onProgress && onProgress(done, rows.length);
  };
  for (let k = 0; k < chunks.length; k += 2) await Promise.all(chunks.slice(k, k + 2).map(work)); // 2 at a time
  if (failed === rows.length) throw {error: lastErr};
  return {results: out, failed, lastErr};
}
async function scoreLeads(c, onlyIds){
  if (!status.claude){ toast("Add ANTHROPIC_API_KEY to the Worker first"); return; }
  const leads = arr(c.leads);
  const target = leads.map((l, n) => [l, n]).filter(([l]) => onlyIds ? onlyIds.includes(l.pullId) : (l.score == null || l.icpV !== c.icp.version));
  if (!target.length){ toast("Every lead is already scored against ICP v" + c.icp.version); return; }
  busy[c.id + ":score"] = {done: 0, of: target.length}; c._scoreErr = ""; render();
  try {
    const {results, failed, lastErr} = await scoreRows(c, target.map(([l]) => leadRow(l)), (d, of) => { busy[c.id + ":score"] = {done: d, of}; render(); });
    const next = leads.slice();
    target.forEach(([l, n], k) => { if (results[k]) next[n] = {...l, ...results[k], icpV: c.icp.version}; });
    busy[c.id + ":score"] = false;
    if (failed) c._scoreErr = `${failed} lead${failed > 1 ? "s" : ""} couldn't be scored (${lastErr}). Click Score again to retry them.`;
    await saveClient(c.id, {leads: next});
    toast(results.filter(r => r && r.pass).length + " of " + (target.length - failed) + " pass");
    if (c.getEmails && status.prospeo){ const keys = target.filter(([, n], k) => results[k]?.pass).map(([l]) => l.key); if (keys.length) await fetchEmails(c, keys, true); }
  } catch(e){ busy[c.id + ":score"] = false; c._scoreErr = e.error; render(); }
}
// Reveal verified emails (Prospeo bulk enrich). Billed only when a verified email is found.
async function fetchEmails(c, keys, quiet = false){
  if (!status.prospeo){ toast("Add PROSPEO_API_KEY to the Worker first"); return; }
  const cur = () => clients.find(x => x.id === c.id) || c;
  const want = new Set(keys);
  const todo = arr(cur().leads).filter(l => want.has(l.key) && !l.email && !l.emailTried);
  if (!todo.length){ if (!quiet) toast("No leads need emails: they already have one or were already tried"); return; }
  busy[c.id + ":emails"] = {of: todo.length}; render();
  try {
    const r = await api("/api/prospeo/emails", {body: {people: todo.map(l => ({id: l.key, pid: l.pid, linkedin: l.linkedin, name: l.name, domain: l.domain}))}});
    const next = arr(cur().leads).map(l => r.emails?.[l.key] ? {...l, email: r.emails[l.key].email || "", emailStatus: r.emails[l.key].status || "", emailTried: true} : l);
    busy[c.id + ":emails"] = false;
    await saveClient(c.id, {leads: next});
    const found = todo.filter(l => r.emails?.[l.key]?.email).length;
    toast(`${found} of ${todo.length} verified email${todo.length === 1 ? "" : "s"} found${r.credits ? " · " + r.credits + " credit" + (r.credits === 1 ? "" : "s") : ""}${r.warning ? ". " + r.warning : ""}`);
  } catch(e){ busy[c.id + ":emails"] = false; cur()._scoreErr = "Emails: " + e.error; render(); }
}
// First/last from Prospeo's fields when we have them, else split the full name (older leads); drops "Dr."/"Jr." style noise
function nameParts(l){
  if (l.first || l.last) return [l.first || "", l.last || ""];
  const t = String(l.name || "").replace(/\b(dr|mr|mrs|ms|prof)\.?\s/i, "").replace(/,?\s+(jr|sr|ii|iii|iv|phd|mba|cpa)\.?$/i, "").trim().split(/\s+/);
  return t.length < 2 ? [t[0] || "", ""] : [t[0], t.slice(1).join(" ")];
}
function leadsCSV(c, rows){
  const tot = totalPts(c);
  const cols = [["score_pct", l => l.score == null ? "" : Math.round(l.score / tot * 100)], ["pass", l => l.pass ? "yes" : l.score == null ? "" : "no"], ["first_name", l => nameParts(l)[0]], ["last_name", l => nameParts(l)[1]], ["title"], ["email"], ["email_status", l => l.emailStatus], ["company"], ["domain"], ["location"], ["linkedin"], ["headline"], ["past_roles", l => l.past], ["source", l => l.variant || "Prospeo"], ["signal"], ["signal_source", l => l.evidenceUrl], ["archetype"], ["disqualifier"], ["reason"], ["opener", l => l.hook]];
  const q = v => { v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  return [cols.map(x => x[0]).join(","), ...rows.map(l => cols.map(([k, f]) => q(f ? f(l) : l[k])).join(","))].join("\n");
}

/* ---------- backtest ---------- */
function backtestPane(c){
  if (!c.icp) return `<div class="note"><b>Build the ICP first.</b> The backtest scores companies you already know against it.</div>`;
  const bt = c.backtest;
  const good = drafts[c.id + ":btGood"] ?? (c.btGood || custDomains(c).join("\n"));
  const bad = drafts[c.id + ":btBad"] ?? (c.btBad || (/crackedgtm\.ai/.test(c.website || "") ? CRACKED_BAD : ""));
  return `<div class="stack">
    <div class="note"><b>How this works.</b> List companies you know are great fits (current customers, won deals) and companies you know are wrong (lost deals, too big, wrong model). The row qualifier scores both. A sharp ICP passes the good ones and rejects the bad ones. Aim for 80% or better on both before you spend credits.</div>
    <div class="bt-grid">
      <div class="field"><label for="btGood">Known good fits (one per line)</label><textarea id="btGood" placeholder="Company name, domain, a few words of context">${esc(good)}</textarea></div>
      <div class="field"><label for="btBad">Known bad fits (one per line)</label><textarea id="btBad" placeholder="Company name, domain, why it's wrong">${esc(bad)}</textarea></div>
    </div>
    <div class="row">
      <label class="range" for="thr">Pass mark <input id="thr" type="range" min="40" max="95" step="5" value="${pct(c)}"> <span id="thrVal">${pct(c)}%</span> <span class="hint">(${passMark(c)} of ${totalPts(c)} pts)</span></label>
      <button class="btn red" id="runBt" type="button" ${busy[c.id + ":bt"] ? "disabled" : ""}>${busy[c.id + ":bt"] ? "Scoring…" : "Run backtest"}</button>
    </div>
    
    ${bt ? (() => {
      const gp = bt.good.filter(r => r.pass).length, br = bt.bad.filter(r => !r.pass).length;
      const gr = bt.good.length ? Math.round(gp / bt.good.length * 100) : 0, rr = bt.bad.length ? Math.round(br / bt.bad.length * 100) : 0;
      const misses = [...bt.good.filter(r => !r.pass).map(r => ({...r, kind:"Good fit rejected"})), ...bt.bad.filter(r => r.pass).map(r => ({...r, kind:"Bad fit passed"}))];
      return `<div class="stats">
        <div class="${gr >= 80 ? "good" : "bad"}"><b>${gr}%</b><span>good fits passed (${gp}/${bt.good.length})</span></div>
        <div class="${rr >= 80 ? "good" : "bad"}"><b>${rr}%</b><span>bad fits rejected (${br}/${bt.bad.length})</span></div>
        <div><b>v${bt.icpV}</b><span>ICP tested · pass mark ${bt.pct}% · ${fmtDate(bt.at)}</span></div>
      </div>
      ${misses.length ? `<div class="tablewrap"><table class="leads"><thead><tr><th>Miss</th><th>Score</th><th>Company</th><th>Reason</th></tr></thead><tbody>${misses.map(r => `<tr><td><span class="chip ${r.kind.startsWith("Bad") ? "r" : "y"}">${r.kind}</span></td><td class="num">${r.score}</td><td>${esc(r.row)}</td><td>${esc(r.reason)}${r.disqualifier ? " · DQ: " + esc(r.disqualifier) : ""}</td></tr>`).join("")}</tbody></table></div>
      <p class="hint">Fix misses at the source: add the missing evidence to the Company brain (for example the lost-deal notes behind a bad fit that passed), sharpen the ICP, then rerun.</p>` : `<p class="hint">No misses. This ICP separates your known good and bad fits at this pass mark.</p>`}`;
    })() : ""}
  </div>`;
}
async function runBacktest(c){
  if (!status.claude){ toast("Add ANTHROPIC_API_KEY to the Worker first"); return; }
  const good = $("#btGood").value.split("\n").map(x => x.trim()).filter(Boolean);
  const bad = $("#btBad").value.split("\n").map(x => x.trim()).filter(Boolean);
  if (good.length < 2 || bad.length < 2){ toast("Add at least 2 good fits and 2 bad fits"); return; }
  delete drafts[c.id + ":btGood"]; delete drafts[c.id + ":btBad"];
  busy[c.id + ":bt"] = true; c._err = ""; c.btGood = good.join("\n"); c.btBad = bad.join("\n"); render();
  try {
    const res = await scoreRows(c, [...good, ...bad]);
    const tag = (rows, off) => rows.map((row, n) => ({row, ...res[off + n]}));
    busy[c.id + ":bt"] = false;
    await saveClient(c.id, {btGood: c.btGood, btBad: c.btBad, backtest: {at: now(), icpV: c.icp.version, pct: pct(c), good: tag(good, 0), bad: tag(bad, good.length)}});
  } catch(e){ busy[c.id + ":bt"] = false; c._err = e.error; render(); }
}

    const sb = $("#sharpenBtn"); if (sb) sb.onclick = () => sharpen(c.id);
    const rb = $("#researchBtn"); if (rb) rb.onclick = () => researchCustomers(c, !custDomains(c).some(d => !c.research?.[d]));
    const pb = $("#patternsBtn"); if (pb) pb.onclick = () => patternsThenICP(c);
    document.querySelectorAll("[data-buyer]").forEach(cb => cb.onchange = () => {
      const d = cb.dataset.buyer; const cur = new Set(arr(c.buyers?.[d]));
      cb.checked ? cur.add(cb.value) : cur.delete(cb.value);
      saveClient(c.id, {buyers: {...(c.buyers || {}), [d]: [...cur]}});
    });
    document.querySelectorAll("[data-showall]").forEach(b => b.onclick = () => { c._showAll = {...(c._showAll || {}), [b.dataset.showall]: !c._showAll?.[b.dataset.showall]}; render(); });
    const ps = $("#pullSite"); if (ps) ps.onclick = () => pullSiteFor(c);
    const pst = $("#pullStripe"); if (pst) pst.onclick = async () => {
      const key = $("#stripeKey").value.trim(); if (!key){ toast("Paste the client's restricted key"); return; }
      busy[c.id + ":stripe"] = true; render();
      try {
        const r = await api("/api/pull-stripe", {body: {key}});
        busy[c.id + ":stripe"] = false; delete drafts[c.id + ":customers"];
        await saveClient(c.id, {inputs: {...(c.inputs||{}), customers: r.csv}, checks: {...(c.checks||{}), customerList: true}, checkedAt: {...(c.checkedAt||{}), customerList: now()}});
        toast(r.count + " customers pulled from Stripe. Research them next.");
      } catch(e){ busy[c.id + ":stripe"] = false; c._err = e.error; render(); }
    };
  }
  {
    document.querySelectorAll("[data-pv]").forEach(b => b.onclick = () => { promptView = b.dataset.pv; render(); });
    const cp = $("#copyPrompt"); if (cp) cp.onclick = () => copy(promptView === "mega" ? megaPrompt(c) : clayPrompt(c));
  }
  {
    const p = prospeoPayload(c);
    const cb = $("#copyBody"); if (cb) cb.onclick = () => copy(JSON.stringify(p.body, null, 2));
    const cc = $("#copyCurl"); if (cc) cc.onclick = () => copy($("#curlText").textContent);
    const rs = $("#runSearch"); if (rs) rs.onclick = () => runSearch(c);
    const sl = $("#scoreLeads"); if (sl) sl.onclick = () => scoreLeads(c);
    const ge = $("#getEmails"); if (ge) ge.onchange = () => saveClient(c.id, {getEmails: ge.checked});
    const fe = $("#findEmails"); if (fe) fe.onclick = () => fetchEmails(c, emailTargets(c).map(l => l.key));

    const cl = $("#clearLeads"); if (cl) cl.onclick = () => saveClient(c.id, {leads: [], pulls: [], prospeoPage: 0, variantPages: {}, prospeoTotal: null, lastRaw: ""});
    const cv = $("#csvLeads"); if (cv) cv.onclick = () => {
      const sel = c._sel || new Set(); const rows = sel.size ? arr(c.leads).filter(l => sel.has(l.key)) : leadsInView(c);
      const blob = new Blob([leadsCSV(c, rows)], {type: "text/csv"}); const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = c.company.replace(/\W+/g, "-").toLowerCase() + "-leads-" + new Date().toISOString().slice(0, 10) + ".csv"; toast("Downloaded " + rows.length + " leads"); a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    const ml = $("#markList"); if (ml) ml.onclick = () => setCheck(c, "listBuilt", !c.checks?.listBuilt);
  }
  {
    if ($("#emSubject")){
    const persist = () => saveClient(c.id, {draft: {subject: $("#emSubject").value, body: $("#emBody").value}});
    $("#emSubject").onchange = persist; $("#emBody").onchange = persist;
    const refreshLink = () => { $("#gmailLink").href = "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(c.email) + "&su=" + encodeURIComponent($("#emSubject").value) + "&body=" + encodeURIComponent($("#emBody").value); };
    $("#emSubject").oninput = refreshLink; $("#emBody").oninput = refreshLink;
    $("#copyEmail").onclick = () => copy("To: " + c.email + "\nSubject: " + $("#emSubject").value + "\n\n" + $("#emBody").value);
    $("#markSent").onclick = () => setCheck(c, "emailSent", !c.checks?.emailSent);
    $("#resetEmail").onclick = () => saveClient(c.id, {draft: null});
    }
  }
  if (c.icp && $("#btGood")){
    ["btGood","btBad"].forEach(k => $("#" + k).addEventListener("input", e => { drafts[c.id + ":" + k] = e.target.value; }));
    $("#thr").oninput = e => { $("#thrVal").textContent = e.target.value + "%"; };
    $("#thr").onchange = e => {
      c.threshold = Number(e.target.value);
      const mark = passMark(c), re = r => ({...r, pass: r.score >= mark && !r.disqualifier});
      const patch = {threshold: c.threshold, leads: arr(c.leads).map(l => l.score == null ? l : re(l))};
      if (c.backtest) patch.backtest = {...c.backtest, pct: c.threshold, good: c.backtest.good.map(re), bad: c.backtest.bad.map(re)};
      saveClient(c.id, patch);
    };
    $("#runBt").onclick = () => runBacktest(c);
  }
  const del = $("#delClient"); if (del) del.onclick = () => { if (c._confirmDel) deleteClient(c.id); else { c._confirmDel = true; render(); setTimeout(() => { c._confirmDel = false; render(); }, 4000); } };
  {
    document.querySelectorAll("[data-check]").forEach(inp => inp.onchange = () => setCheck(c, inp.dataset.check, inp.checked));
  }
}
async function setCheck(c, k, v, rerender = true){
  await saveClient(c.id, {checks: {...(c.checks||{}), [k]: v}, checkedAt: {...(c.checkedAt||{}), [k]: v ? now() : null}});
}

function openOnboard(){ $("#onboardModal").hidden = false; setTimeout(() => $("#obFirst").focus(), 30); }
$("#onboardBtn").onclick = openOnboard;

$("#fillCracked").onclick = fillCracked;
$("#settingsBtn").onclick = () => { $("#setStripe").value = settings.stripe || ""; $("#setGuide").value = settings.guide || ""; $("#setSign").value = settings.sign || ""; $("#settingsModal").hidden = false; };
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest(".scrim").hidden = true);
document.querySelectorAll(".scrim").forEach(s => s.addEventListener("click", e => { if (e.target === s) s.hidden = true; }));
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".scrim").forEach(s => s.hidden = true); });
$("#obEmail").addEventListener("blur", () => { if (!$("#obSite").value.trim()){ const d = domainOf($("#obEmail").value); if (d && !FREEMAIL.has(d)) $("#obSite").value = d; } });

$("#onboardForm").addEventListener("submit", async e => {
  e.preventDefault();
  const company = $("#obCompany").value.trim(), first = $("#obFirst").value.trim(), email = $("#obEmail").value.trim();
  if (!company || !first || !email) return;
  const slug = company.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "client";
  const id = slug + "-" + Date.now().toString(36);
  const website = domainOf($("#obSite").value) || (FREEMAIL.has(domainOf(email)) ? "" : domainOf(email));
  // drop the example client once a real one exists in preview mode
  await createClient({id, company, first, email, website, createdAt: now(), inputs:{}, checks:{}, checkedAt:{}, icp:null, history:[], draft:null, autoSharpen:true});
  $("#onboardModal").hidden = true; e.target.reset();
  selected = id; render();
  toast(company + " onboarded. Email drafted, pulling their site…");
  const nc = clients.find(x => x.id === id); if (nc && website) pullSiteFor(nc);
});
$("#settingsForm").addEventListener("submit", async e => {
  e.preventDefault();
  settings = {stripe: $("#setStripe").value.trim(), guide: $("#setGuide").value.trim(), sign: $("#setSign").value.trim() || "Priyanka & Khaled"};
  $("#settingsModal").hidden = true; render();
  try { await api("/api/settings", {method:"PUT", body: settings}); toast("Settings saved"); } catch(err){ toast("Couldn't save settings: " + err.error); }
});

boot();
})();
</script>

</body>
</html>
